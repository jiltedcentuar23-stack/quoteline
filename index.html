<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quoteline — Show-off</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a12; --panel: #12121f; --red: #e82127; --blue: #2a6fd6;
    --glow-red: rgba(232,33,39,0.45); --glow-blue: rgba(42,111,214,0.40);
    --fg: #f4f4f8; --muted: #8a8aa3; --line: #1e1e30;
    --cat-serious: #2a6fd6; --cat-funny: #e8a33d; --cat-motivational: #39d98a; --cat-random: #c752c9;
  }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background:
      radial-gradient(1200px 500px at 50% -10%, rgba(42,111,214,0.10), transparent 60%),
      radial-gradient(900px 400px at 50% 0%, rgba(232,33,39,0.08), transparent 60%),
      var(--bg);
    color: var(--fg); min-height: 100vh;
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 32px; background: rgba(18,18,31,0.8); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5;
  }
  .logo { font-family: 'Archivo Black', sans-serif; font-size: 26px; letter-spacing: 2px; }
  .logo .s,.logo .a,.logo .a2,.logo .k { color: var(--red); text-shadow: 0 0 18px var(--glow-red); }
  .logo .n,.logo .c,.logo .b,.logo .r { color: var(--blue); text-shadow: 0 0 18px var(--glow-blue); }
  .tagline { color: var(--muted); font-size: 12px; letter-spacing: 1px; margin-top: 2px; }
  .live-pill { display:flex; align-items:center; gap:8px; font-weight:800; font-size:13px; letter-spacing:1px;
    background: linear-gradient(90deg, var(--red), var(--blue)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .live-dot { width:9px; height:9px; border-radius:50%; background:#39d98a; box-shadow:0 0 12px #39d98a; animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

  .wrap { max-width: 780px; margin: 0 auto; padding: 40px 24px 70px; }

  .day-line { text-align:center; font-size:12px; letter-spacing:3px; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  .day-count { text-align:center; font-family:'Archivo Black',sans-serif; font-size:15px; letter-spacing:2px; margin-bottom:26px; }
  .cats { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:30px; }
  .cat-btn {
    position:relative; padding:11px 22px; border-radius:30px; border:1px solid #2a2a44; background:var(--panel);
    color:var(--muted); font-weight:700; font-size:14px; cursor:pointer; transition:all .2s; letter-spacing:.5px;
    display:flex; align-items:center; gap:9px;
  }
  .cat-btn .cd { width:8px; height:8px; border-radius:50%; background:var(--cc,#2a6fd6); }
  .cat-btn:hover { color:var(--fg); border-color:var(--cc); transform:translateY(-1px); }
  .cat-btn.active { color:#fff; border-color:transparent; box-shadow:0 0 20px var(--glow-red), 0 0 20px var(--glow-blue);
    background:linear-gradient(90deg,var(--red),var(--blue)); }
  .cat-btn .cnt { font-size:11px; opacity:.7; }

  .quote-card { position:relative; background:var(--panel); border-radius:18px; padding:48px 44px 38px; border:1px solid var(--line); overflow:hidden; }
  .quote-card::before {
    content:'\201C'; position:absolute; top:8px; left:22px; font-family:'Archivo Black',serif; font-size:170px; line-height:1;
    background:linear-gradient(135deg,var(--red),var(--blue)); -webkit-background-clip:text; background-clip:text; color:transparent; opacity:0.22;
  }
  .q-kicker { font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--muted); margin-bottom:16px; }
  .q-text { font-size:clamp(24px,4.2vw,38px); font-weight:800; line-height:1.3; letter-spacing:-.5px; margin-bottom:22px; position:relative; z-index:1; }
  .q-text .close { font-family:'Archivo Black',serif; opacity:.85; }
  .q-meta { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; position:relative; z-index:1; }
  .q-attr { font-size:15px; }
  .q-attr .spk { color:var(--red); font-weight:700; text-shadow:0 0 12px var(--glow-red); }
  .q-attr .src { color:var(--muted); }
  .q-attr .yr { color:var(--blue); font-weight:600; }
  .cat-badge { font-size:11px; letter-spacing:1.5px; text-transform:uppercase; padding:5px 14px; border-radius:14px; background:#1e1e30; border:1px solid #2a2a44; }

  .watch-row { margin-top:26px; padding-top:20px; border-top:1px solid var(--line); position:relative; z-index:1; }
  .watch-label { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
  .watch-chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { display:flex; align-items:center; gap:7px; padding:8px 15px; border-radius:9px; background:#1a1a2e; border:1px solid #2a2a44;
    font-size:13px; font-weight:600; color:var(--fg); cursor:pointer; transition:all .15s; text-decoration:none; }
  .chip:hover { transform:translateY(-1px); border-color:var(--blue); }
  .chip .dot { width:8px; height:8px; border-radius:50%; }
  .watch-disclaimer { margin-top:10px; font-size:11px; color:var(--muted); opacity:.8; line-height:1.4; }
  .watch-disclaimer a { color:var(--blue); text-decoration:none; }
  .no-stream { font-size:13px; color:var(--muted); font-style:italic; }

  .actions { display:flex; gap:12px; justify-content:center; margin-top:28px; }
  .btn { padding:14px 34px; border-radius:12px; font-family:'Inter',sans-serif; font-weight:700; font-size:15px; letter-spacing:.5px; cursor:pointer; border:none; transition:all .2s; }
  .btn-primary { background:linear-gradient(90deg,var(--red),var(--blue)); color:#fff; box-shadow:0 0 24px var(--glow-red),0 0 24px var(--glow-blue); }
  .btn-primary:hover { transform:translateY(-2px); }
  .btn-ghost { background:transparent; color:var(--muted); border:1px solid #2a2a44; }
  .btn-ghost:hover { color:var(--fg); border-color:var(--red); }

  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:40px; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px 14px; text-align:center; }
  .stat .num { font-family:'Archivo Black',sans-serif; font-size:32px; line-height:1;
    background:linear-gradient(90deg,var(--red),var(--blue)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .stat .lbl { margin-top:7px; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); }

  .footer { text-align:center; padding:34px 24px 10px; color:var(--muted); font-size:12px; letter-spacing:1px; }
  .footer .grad { background:linear-gradient(90deg,var(--red),var(--blue)); -webkit-background-clip:text; background-clip:text; color:transparent; font-weight:800; }

  @media (max-width:560px){ .stats{grid-template-columns:repeat(2,1fr)} .quote-card{padding:38px 26px 30px} }
</style>
</head>
<body>
  <div class="topbar">
    <div>
      <div class="logo">QUOTELINE</div>

    <div class="live-pill"><span class="live-dot"></span> LIVE</div>

  <div class="wrap">

    <div class="cats" id="cats">

      <button class="cat-btn" data-cat="motivational" style="--cc:var(--cat-motivational)"><span class="cd"></span>Motivational <span class="cnt"></span></button>
      <button class="cat-btn active" data-cat="random" style="--cc:var(--cat-random)"><span class="cd"></span>Random <span class="cnt"></span></button>

    <div class="quote-card">

      <div class="q-meta">
        <div class="q-attr" id="attribution"></div>
        <div class="cat-badge" id="catBadge"></div>
      </div>
      <div class="watch-row" id="watchRow">
        <div class="watch-label">Watch it on</div>
        <div class="watch-chips" id="watchChips"></div>
        <div class="watch-disclaimer" id="watchDisclaimer">Availability changes monthly &middot; last checked <span id="disclaimerDate"></span>. If a service doesn't have it, <a href="https://www.justwatch.com" target="_blank" rel="noopener">check JustWatch</a>.</div>

    </div>

    <div class="actions">
      <button class="btn btn-ghost" id="shareBtn">Share</button>
      <button class="btn btn-primary" id="nextBtn">NEXT QUOTE &rarr;</button>
    </div>

    <div class="stats" id="stats"></div>
  </div>

  <div class="footer"><span class="grad">QUOTELINE</span> &middot; every category, every day</div>

 false}, {"id": 702, "quote": "The very things that held you down are gonna carry you up and up and up!", "speaker": "", "character": "", "source": "", "year": null, "categories": ["motivational"], "streaming": [], "streaming_checked": false}, {"id": 703, "quote": "Fight to win, never be afraid. Be ruthless, be merciless. Be resourceful. Kill anyone who gets in your way. Your own brother, even God himself.", "speaker": "", "character": "", "source": "", "year": null, "categories": ["motivational"], "streaming": [], "streaming_checked": false}, {"id": 704, "quote": "That's a warrior's life. We either kill, or get killed. If you are not good, you'll die on the battle field. But if you are good, you'll spend your life fighting. Either way, we die in the end. It's not an easy life.", "speaker": "", "character": "", "source": "", "year": null, "categories": ["motivational"], "streaming": [], "streaming_checked": false}, {"id": 705, "quote": "Onward to victory! No one can defeat us now!", "speaker": "Frank Welker", "character": "Megatron", "source": "The Transformers (1984)", "year": 1984, "categories": ["motivational"], "streaming": ["Prime Video"], "streaming_checked": true}, {"id": 706, "quote": "We must keep fighting at all costs! I will lead us to victory yet!", "speaker": "Frank Welker", "character": "Megatron", "source": "The Transformers (1984)", "year": 1984, "categories": ["motivational"], "streaming": ["Prime Video"], "streaming_checked": true}, {"id": 707, "quote": "We're pinched, for sure. -No way. Only the meek get pinched. The bold survive. Let's go.", "speaker": "Matthew Broderick", "character": "Ferris Bueller", "source": "Ferris Bueller's Day Off", "year": null, "categories": ["motivational"], "streaming": ["Paramount+"], "streaming_checked": true}, {"id": 708, "quote": "I don't care how fast they run. I'm gonna run faster. I don't care how much they want it. I want it more.", "speaker": "", "character": "", "source": "", "year": null, "categories": ["motivational"], "streaming": [], "streaming_checked": false}, {"id": 709, "quote": "Well, you wanna know what I see? I see pride. I see power!", "speaker": "Malik Yoba", "character": "Yul Brenner", "source": "Cool Runnings", "year": null, "categories": ["motivational"], "streaming": ["Max"], "streaming_checked": true}, {"id": 710, "quote": "Okay, guys, tonight's the night. Now, in a few minutes, you're gonna get a chance to do something that no one in your country has ever done.", "speaker": "John Candy", "character": "Irv Blitzer", "source": "Cool Runnings", "year": null, "categories": ["motivational"], "streaming": ["Max"], "streaming_checked": true}, {"id": 711, "quote": "All right, it's time to go. But I want you to know, no matter what happens out there tonight... in my heart, each and every one of you is a champion.", "speaker": "", "character": "", "source": "", "year": null, "categories": ["motivational"], "streaming": [], "streaming_checked": false}, {"id": 712, "quote": "Do you know who I was? Nobody. Except on the day after, I was still alive. This nobody had a chance to be somebody.", "speaker": "Tina Turner", "character": "Aunty Entity", "source": "Mad Max Beyond Thunderdome", "year": null, "categories": ["motivational"], "streaming": ["Prime Video"], "streaming_checked": true}, {"id": 713, "quote": "We'll never be obsolete. Carry on the tradition. We're the best.", "speaker": "", "character": "", "source": "", "year": null, "categories": ["motivational"], "streaming": [], "streaming_checked": false}, {"id": 714, "quote": "Beethoven was deaf. Helen Keller was blind. I think Rocky's got a good chance.", "speaker": "Talia Shire", "character": "Adrian Balboa", "source": "Rocky (1976)", "year": 1976, "categories": ["motivational"], "streaming": ["Prime Video"], "streaming_checked": true}, {"id": 715, "quote": "You'll be able to spit nails, kid. Like the guy says, you're gonna eat lightning, and you're gonna crap thunder.", "speaker": "Burgess Meredith", "character": "Mickey Goldmill", "source": "Rocky (1976)", "year": 1976, "categories": ["motivational"], "streaming": ["Prime Video"], "streaming_checked": true}, {"id": 716, "quote": "Go! Confront the problem! Fight! Win!", "speaker": "", "character": "", "source": "", "year": null, "categories": ["motivational"], "streaming": [], "streaming_checked": false}, {"id": 717, "quote": "Try something fresher, something pleasant. Try again, don't give up.", "speaker": "", "character": "", "source": "", "year": null, "categories": ["motivational"], "streaming": [], "streaming_checked": false}, {"id": 718, "quote": "We're together now. Everything's going to be fine, you'll see.", "speaker": "", "character": "", "source": "", "year": null, "categories": ["motivational"], "streaming": [], "streaming_checked": false}, {"id": 719, "quote": "No, man, but you gotta keep going. What am I gonna do, quit? That's not an option. You got to keep on keepin' on.", "speaker": "David Spade", "character": "Joe Dirt", "source": "Joe Dirt (2001)", "year": 2001, "categories": ["motivational"], "streaming": ["Tubi"], "streaming_checked": true}, {"id": 720, "quote": "He's quite the motivational speaker, isn't he?", "speaker": "", "character": "", "source": "", "year": null, "categories": ["motivational"], "streaming": [], "streaming_checked": false}, {"id": 721, "quote": "We will not go quietly into the night! We will not vanish without a fight! We're going to live on! We're going to survive!", "speaker": "", "character": "", "source": "", "year": null, "categories": ["motivational"], "streaming": [], "streaming_checked": false}, {"id": 722, "quote": "All right, if you can drive as good as you can fix a road then you can win this race with your eyes shut. Now, get back out there!", "speaker": "Paul Newman", "character": "Doc Hudson", "source": "Cars", "year": null, "categories": ["motivational"], "streaming": ["Disney+"], "streaming_checked": true}, {"id": 723, "quote": "We can still win this thing. It's not over with. We gotta come together. We gotta believe in ourselves. We can come back and win this game.", "speaker": "", "character": "", "source": "", "year": null, "categories": ["motivational"], "streaming": [], "streaming_checked": false}, {"id": 724, "quote": "Ready? Feel the rhythm, feel the rhyme, get on up, it's bobsled time! Cool runnings! On the track.", "speaker": "", "character": "", "source": "", "year": null, "categories": ["motivational"], "streaming": [], "streaming_checked": false}, {"id": 725, "quote": "Worse things have happened. I think we're gonna be fine. Color me up, will you?", "speaker": "Robert Downey Jr.", "character": "Tony Stark Iron Man", "source": "Iron Man (2008)", "year": 2008, "categories": ["motivational"], "streaming": ["Disney+"], "streaming_checked": true}, {"id": 726, "quote": "Remember, the Force will be with you always.", "speaker": "Alec Guinness", "character": "Obi Wan Kenobi", "source": "Star Wars: Episode IV - A New Hope", "year": null, "categories": ["motivational"], "streaming": ["Disney+"], "streaming_checked": true}, {"id": 727, "quote": "There's always tomorrow for dreams to come true. Tomorrow is not far away.", "speaker": "", "character": "", "source": "", "year": null, "categories": ["motivational"], "streaming": [], "streaming_checked": false}, {"id": 728, "quote": "Come on, guys, keep your head up. Got a whole other half to play.", "speaker": "", "character": "", "source": "", "year": null, "categories": ["motivational"], "streaming": [], "streaming_checked": false}, {"id": 729, "quote": "We're letting them push us around. We gotta fight them back. We gotta take it to them. We gotta get right in their faces.", "speaker": "", "character": "", "source": "", "year": null, "categories": ["motivational"], "streaming": [], "streaming_checked": false}, {"id": 730, "quote": "We're ready. -Better believe it.", "speaker": "", "character": "", "source": "", "year": null, "categories": ["motivational"], "streaming": [], "streaming_checked": false}, {"id": 731, "quote": "I know you're going to be there, and you're going to be great. In fact, I know you're going to be perfect.", "speaker": "", "character": "", "source": "", "year": null, "categories": ["motivational"], "streaming": [], "streaming_checked": false}, {"id": 732, "quote": "Okay, people, people, look alive. Let's go. Come on. Get up. Let's move it. Rise and shine. Y'all way past the beauty sleep thing, trust me.", "speaker": "Eddie Murphy", "character": "Mushu", "source": "Mulan (1998)", "year": 1998, "categories": ["motivational"], "streaming": ["Disney+"], "streaming_checked": true}, {"id": 733, "quote": "If you go through with this, you've got to win. If you muck it up, don't ever think of coming back here, except in your coffin.", "speaker": "No\u00ebl Coward", "character": "Mr. Bridger", "source": "The Italian Job (1969)", "year": 1969, "categories": ["motivational"], "streaming": ["Tubi"], "streaming_checked": true}, {"id": 734, "quote": "Don't worry, old fellow. It's not entirely hopeless.", "speaker": "", "character": "", "source": "", "year": null, "categories": ["motivational"], "streaming": [], "streaming_checked": false}, {"id": 735, "quote": "Why are you sitting there resting when we're so near the end? Come on, let's go!", "speaker": "Sean Connery", "character": "Henry Jones", "source": "Indiana Jones and the Last Crusade", "year": null, "categories": ["motivational"], "streaming": ["Disney+"], "streaming_checked": true}, {"id": 736, "quote": "No one's ever really disabled as long as he had courage!", "speaker": "", "character": "", "source": "", "year": null, "categories": ["motivational"], "streaming": [], "streaming_checked": false}, {"id": 737, "quote": "Now don't you go and give up, give out or give in. When the going's rough, just get tough and just tell yourself you're gonna win.", "speaker": "", "character": "", "source": "", "year": null, "categories": ["motivational"], "streaming": [], "streaming_checked": false}, {"id": 738, "quote": "You nervous? -I'm not nervous. I'm ready. I've been ready for this day my whole life.", "speaker": "", "character": "", "source": "", "year": null, "categories": ["motivational"], "streaming": [], "streaming_checked": false}, {"id": 739, "quote": "Maybe today is a bad day. -Yeah. -I'll come back tomorrow. And the next day. And the next day.", "speaker": "", "character": "", "source": "", "year": null, "categories": ["motivational"], "streaming": [], "streaming_checked": false}, {"id": 740, "quote": "I never look back, darling. It distracts from the now.", "speaker": "", "character": "", "source": "", "year": null, "categories": ["motivational"], "streaming": [], "streaming_checked": false}, {"id": 741, "quote": "Stay fit. Keep sharp. Make good decisions.", "speaker": "Rick Moranis", "character": "Louis Tully", "source": "Ghostbusters II", "year": null, "categories": ["motivational"], "streaming": ["Peacock"], "streaming_checked": true}, {"id": 742, "quote": "You listen to me, my boy. I've made a living out of being a failure. And you, sir, are not a failure!", "speaker": "", "character": "", "source": "", "year": null, "categories": ["motivational"], "streaming": [], "streaming_checked": false}, {"id": 743, "quote": "Even the smallest person can change the course of the future.", "speaker": "Cate Blanchett", "character": "Galadriel", "source": "The Lord of the Rings: The Fellowship of the Ring", "year": null, "categories": ["motivational"], "streaming": ["Prime Video"], "streaming_checked": true}, {"id": 744, "quote": "And you must not let anyone define your limits because of where you come from. Your only limit is your soul.", "speaker": "Brad Garrett", "character": "Auguste Gusteau", "source": "Ratatouille", "year": null, "categories": ["motivational"], "streaming": ["Disney+"], "streaming_checked": true}, {"id": 745, "quote": "It's gonna be fine, baby. It's gonna be a nice, fine, boring life.", "speaker": "", "character": "", "source": "", "year": null, "categories": ["motivational"], "streaming": [], "streaming_checked": false}, {"id": 746, "quote": "You're a tiger. You're stronger than I am. When you set your mind on doing something, you do it better than anybody.", "speaker": "", "character": "", "source": "", "year": null, "categories": ["motivational"], "streaming": [], "streaming_checked": false}, {"id": 747, "quote": "Now remember, when things look bad, and it looks like you won't make it, then you got to get mean. I mean plumb, mad-dog mean!", "speaker": "Clint Eastwood", "character": "Josey Wales", "source": "The Outlaw Josey Wales", "year": null, "categories": ["motivational"], "streaming": ["Tubi"], "streaming_checked": true}, {"id": 748, "quote": "If we stop breathing, we'll die. If we stop fighting our enemies, the world will die.", "speaker": "", "character": "", "source": "", "year": null, "categories": ["motivational"], "streaming": [], "streaming_checked": false}, {"id": 749, "quote": "And you don't win for anybody else, you win for you. You know why? Because a man takes what he wants, he takes it all. And you're a man, aren't you? Aren't you?", "speaker": "", "character": "", "source": "", "year": null, "categories": ["motivational"], "streaming": [], "streaming_checked": false}, {"id": 750, "quote": "My _ing warriors, who will not hang up the phone until their client either buys or _ing dies!", "speaker": "Leonardo DiCaprio", "character": "Jordan Belfort", "source": "The Wolf of Wall Street", "year": null, "categories": ["motivational"], "streaming": ["Paramount+"], "streaming_checked": true}, {"id": 751, "quote": "I want you to deal with your problems by becoming rich!", "speaker": "Leonardo DiCaprio", "character": "Jordan Belfort", "source": "The Wolf of Wall Street", "year": null, "categories": ["motivational"], "streaming": ["Paramount+"], "streaming_checked": true}, {"id": 752, "quote": "I don't believe in the no-win scenario.", "speaker": "William Shatner", d": 760, "quote": "If the limit never approaches anything... The limit does not exist. The limit does not exist!", "speaker": "Lindsay Lohan", "character": "Cady Heron", "source": "Mean Girls (2004)", "year": 2004, "categories": ["motivational"], "streaming": ["Paramount+"], "streaming_checked": true}, {"id": 761, "quote": "I don't believe in surrenders. I still got my saber, Reverend. Didn't turn it into no plowshare neither.", "speaker": "John Wayne", "character": "Ethan Edwards", "source": "The Searchers (1956)", "year": 1956, "categories": ["motivational"], "streaming": ["Tubi"], "streaming_checked": true}, {"id": 762, "quote": "Look, I get it. You guys have concerns. But we've been through worse!", "speaker": "Amy Poehler", "character": "Joy", "source": "Inside Out", "year": null, "categories": ["motivational"], "streaming": ["Disney+"], "streaming_checked": true}, {"id": 763, "quote": "I feel a lot of solid energy coming out of you. Good positive aura. Great, great, it's all great.", "speaker": "", "character": "", "source": "", "year": null, "categories": ["motivational"], "streaming": [], "streaming_checked": false}, {"id": 764, "quote": "It ain't over yet. The way I see it, we've only just begun.", "speaker": "Adam Sandler", "character": "Happy Gilmore", "source": "Happy Gilmore", "year": null, "categories": ["motivational"], "streaming": ["Disney+"], "streaming_checked": true}, {"id": 765, "quote": "No doubt. Stay up, baby. Hold your head. One.", "speaker": "Method Man", "character": "Shameek", "source": "Belly (1998)", "year": 1998, "categories": ["motivational"], "streaming": ["Tubi"], "streaming_checked": true}, {"id": 766, "quote": "You know what I think? Honestly? I think that once you're out there, and you're doing your thing out there, I think you're gonna be really great. Really great.", "speaker": "Marisa Tomei", "character": "Mona Lisa Vito", "source": "My Cousin Vinny", "year": null, "categories": ["motivational"], "streaming": ["Tubi"], "stream ": 1947, "categories": ["motivational"], "streaming": ["Tubi"], "streaming_checked": true}, {"id": 781, "quote": "I mean, just because things don't turn out the way you want them to the first time, you've still got to believe in people. I found that out.", "speaker": "", "character": "", "source": "", "year": null, "categories": ["motivational"], "streaming": [], "streaming_checked": false}, {"id": 782, "quote": "Something important has just happened. I was in the toilet reading my contract, and it turns out I get a bonus when we get to the World Series. So, let's play hard! Let's play smart!", "speaker": "Tom Hanks", "character": "Jimmy Dugan", "source": "A League of Their Own", "year": null, "categories": ["motivational"], "streaming": ["Prime Video"], "streaming_checked": true}, {"id": 783, "quote": "Kid, you can beat these guys. Find a groove that works for you and get that lap back.", "speaker": "Paul Newman", "character": "Doc Hudson", "source": "Cars", "year": null, "categories": ["motivational"], "streaming": ["Disney+"], "streaming_checked": true}, {"id": 784, "quote": "Come back with your shield or on it. -Yes, milady.", "speaker": "Lena Headey", "character": "Queen Gorgo", "source": "300", "year": null, "categories": ["motivational"], "streaming": ["Prime Video"], "streaming_checked": true}, {"id": 785, "quote": "Are you gonna let that guy muscle in? Who's it gonna be? You... or him?", "speaker": "", "character": "", "source": "", "year": null, "categories": ["motivational"], "streaming": [], "streaming_checked": false}, {"id": 786, "quote": "Once a pawn has crossed the line, he has to stay. There's no way back.", "speaker": "", "character": "", "source": "", "year": null, "categories": ["motivational"], "streaming": [], "streaming_checked": false}, {"id": 787, "quote": "Every day I practice eight hours, but it isn't enough. So then I'll do more! I'll practice 16 hours! I'll work till I drop!", "speaker": "", "character": "", "source": "", "year": null, " ational"], "streaming": [], "streaming_checked": false}, {"id": 866, "quote": "Come on, Squints! You can do it! Pull through, bud!", "speaker": "", "character": "", "source": "", "year": null, "categories": ["motivational"], "streaming": [], "streaming_checked": false}, {"id": 867, "quote": "No place is too far if it's what we want.", "speaker": "", "character": "", "source": "", "year": null, "categories": ["motivational"], "streaming": [], "streaming_checked": false}, {"id": 868, "quote": "And now we've picked up the trail again, and nothing can stop us! Not even the snows of winter nor the peaks of the highest mountains.", "speaker": "", "character": "", "source": "", "year": null, "categories": ["motivational"], "streaming": [], "streaming_checked": false}, {"id": 869, "quote": "Think big, think positive. Never show any sign of weakness. Always go for the throat.", "speaker": "Dan Aykroyd", "character": "Louis Winthorpe", "source": "Trading places (1983)", "year": 1983, "categories": ["motivational"], "streaming": ["Tubi"], "streaming_checked": true}, {"id": 870, "quote": "Hey, don't be silly. What's a Warrior to do after he's lost the big one? Win a few of the little ones.", "speaker": "", "character": "", "source": "", "year": null, "categories": ["motivational"], "streaming": [], "streaming_checked": false}, {"id": 871, "quote": "We can do it! This will be easy! This is working!", "speaker": "Amy Poehler", "character": "Joy", "source": "Inside Out", "year": null, "categories": ["motivational"], "streaming": ["Disney+"], "streaming_checked": true}, {"id": 872, "quote": "I did not come this far to stop now.", "speaker": "Jean-Claude Van Damme", "character": "Frank Dux", "source": "Bloodsport", "year": null, "categories": ["motivational"], "streaming": ["Tubi"], "streaming_checked": true}, {"id": 873, "quote": "Don't start to doubt yourself. Be confident.", "speaker": "", "character": "", "source": "", "year": null, "categories": ["motivational"], "streaming": [ ", "speaker": "Ralph Fiennes", "character": "Harry", "source": "In Bruges", "year": 2008, "categories": ["funny"], "streaming": ["Prime Video"], "streaming_checked": true}, {"id": 1016, "quote": "Harry, you might not believe this, but I never considered not sleeping with you a sacrifice.", "speaker": "Meg Ryan", "character": "Sally Albright", "source": "When Harry Met Sally...", "year": 1989, "categories": ["funny"], "streaming": ["Tubi"], "streaming_checked": true}, {"id": 1017, "quote": "He's so fluffy, I'm gonna die!", "speaker": "Elsie Fisher", "character": "Agnes", "source": "Despicable Me", "year": 2010, "categories": ["funny"], "streaming": ["Prime Video"], "streaming_checked": true}]};
  const SERVICE_URLS = {
    'Tubi':'https://tubitv.com','Max':'https://www.max.com','Prime Video':'https://www.primevideo.com',
    'Netflix':'https://www.netflix.com','Apple TV':'https://tv.apple.com','Hulu':'https://www.hulu.com',
    'Disney+':'https://www.disneyplus.com','Peacock':'https://www.peacocktv.com','Paramount+':'https://www.paramountplus.com',
    'Pluto TV':'https://pluto.tv','Plex':'https://www.plex.tv','Philo':'https://www.philo.com',
    'AMC+':'https://amcplus.com','MGM+':'https://www.mgmplus.com',
    'Fawesome':'https://fawesome.tv','The Roku Channel':'https://therokuchannel.roku.com','Paramount':'https://www.paramountplus.com'
  };
  const SVC_COLOR = {
    'Tubi':'#f5a623','Max':'#0080ff','Prime Video':'#00a8e1','Netflix':'#e50914','Apple TV':'#fa58c7',
    'Hulu':'#1ce6b0','Disney+':'#113ccf','Peacock':'#feb019','Paramount+':'#0064ff','Paramount':'#0064ff',
    'Pluto TV':'#8b5cf6','Plex':'#e5a00d','Philo':'#6c5ce7','AMC+':'#7b7b8a','MGM+':'#c9a227',
    'Fawesome':'#ff5e5b','The Roku Channel':'#7b2ff7'
  };

  // ALL verified quotes = the master list that "Next Quote" cycles through.
  let quotes = [];
  // Per-category daily pools: each category rotates its own 365.
  // "random" is ITS OWN track — only quotes tagged purely "random" (nothing else).
  function dailyPool(cat){
    if (cat === 'random') return quotes.filter(q => q.categories.length === 1 && q.categories[0] === 'random');
    return quotes.filter(q => q.categories.includes(cat));
  }
  // Cursor into the MASTER list (Next Quote walks this).
  let cursor = 0;
  // Which category tab is highlighted (the "daily pick" lens).
  let activeCat = 'random';
  // When a tab is clicked we want the kicker to say "Today's <Cat> Pick".
  let justPickedCat = false;

  const el = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const CAT_COLOR = { serious:'var(--cat-serious)', funny:'var(--cat-funny)', motivational:'var(--cat-motivational)', random:'var(--cat-random)' };

  // DAY BOUNDARY: UTC midnight. Everyone worldwide sees the SAME pick on the
  // same date; it flips at 00:00 UTC (7 PM CDT). We derive the "day" from UTC
  // fields, not the visitor's local clock.
  function utcDayOfYear(now){
    const y = now.getUTCFullYear();
    const start = Date.UTC(y, 0, 0);
    return Math.floor((now - start) / 86400000);   // 1..365/366
  }
  function todayUTC(){ return new Date(); }   // read UTC fields, not local
  // Deterministic daily pick for a category = index by UTC day-of-year into that pool.
  function dailyIndex(cat){
    const pool = dailyPool(cat);
    if (!pool.length) return -1;
    return utcDayOfYear(todayUTC()) % pool.length;
  }
  // Convert a pool-relative index to a MASTER index (quotes[cursor]).
  function masterIndex(cat, poolIdx){
    const pool = dailyPool(cat);
    const q = pool[poolIdx % pool.length];
    return quotes.indexOf(q);
  }

  function render(){
    el('dayCount').textContent = 'DAY ' + String(utcDayOfYear(todayUTC())).padStart(3,'0') + ' / 365';
    cursor = ((cursor % quotes.length) + quotes.length) % quotes.length;
    const q = quotes[cursor];
    const pool = dailyPool(activeCat);
    const poolIdx = pool.indexOf(q);
    const isDaily = justPickedCat
      ? (poolIdx >= 0)
      : (poolIdx === dailyIndex(activeCat));
    el('qKicker').textContent = isDaily
      ? ("Today's " + (activeCat === 'random' ? 'Random' : activeCat.charAt(0).toUpperCase()+activeCat.slice(1)) + " Pick")
      : "From the " + (activeCat === 'random' ? 'Random' : activeCat.charAt(0).toUpperCase()+activeCat.slice(1) + " Track");
    justPickedCat = false;   // only true for the render immediately after a tab click
    el('quoteText').innerHTML = esc(q.quote) + ' <span class="close">\u201D</span>';
    el('attribution').innerHTML =
      '<span class="spk">'+esc(q.speaker)+'</span> <span class="src">as '+esc(q.character)+' &middot; '+esc(q.source)+'</span> <span class="yr">('+q.year+')</span>';
    const c = q.categories[0] || 'random';
    el('catBadge').textContent = c.toUpperCase();
    el('catBadge').style.borderColor = CAT_COLOR[c];
    el('catBadge').style.color = 'var(' + CAT_COLOR[c] + ')';

    if (q.streaming && q.streaming.length){
      el('watchChips').innerHTML = q.streaming.map(s => {
        const href = SERVICE_URLS[s] || '#';
        return '<a class="chip" href="'+href+'" target="_blank" rel="noopener"><span class="dot" style="background:'+(SVC_COLOR[s]||'#2a6fd6')+'"></span>'+esc(s)+'</a>';
      }).join('');
      const checked = q.streaming_checked ? fmtDate(q.streaming_checked) : fmtDate(new Date().toISOString().slice(0,10));
      el('disclaimerDate').textContent = checked;
    } else {
      el('watchChips').innerHTML = '<span class="no-stream">availability TBA</span>';
    }
  }

  function updateCatCounts(){
    document.querySelectorAll('.cat-btn').forEach(b => {
      const n = dailyPool(b.dataset.cat).length;
      b.querySelector('.cnt').textContent = n;
    });
  }

  function fmtDate(iso){ const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return iso; return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }

  function stats(){
    const movies = new Set(quotes.map(q=>q.source));
    const withStream = quotes.filter(q=>q.streaming&&q.streaming.length).length;
    const cards = [[quotes.length,'Verified Quotes'],[movies.size,'Movies'],[withStream,'With Streaming'],[4,'Daily Tracks']];
    el('stats').innerHTML = cards.map(([n,l])=>'<div class="stat"><div class="num">'+n+'</div><div class="lbl">'+l+'</div></div>').join('');
  }

  el('cats').addEventListener('click', e => {
    const b = e.target.closest('.cat-btn'); if(!b) return;
    document.querySelectorAll('.cat-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); activeCat = b.dataset.cat; justPickedCat = true;
    const di = dailyIndex(activeCat);
    if (di >= 0) cursor = masterIndex(activeCat, di);   // jump to this category's daily pick (master index)
    render();
  });
  // Order of the daily tabs as "Next Quote" cycles through them.
  const CAT_ORDER = ['serious','funny','motivational','random'];
  // NEXT QUOTE: does NOT generate a new quote — it just hops to the NEXT
  // category's daily pick (Serious -> Funny -> Motivational -> Random -> Serious).
  // A visitor sees exactly ONE quote per category per day, so they come back
  // tomorrow for the new picks instead of burning through the pool.
  el('nextBtn').addEventListener('click', () => {
    const i = CAT_ORDER.indexOf(activeCat);
    const nextCat = CAT_ORDER[(i + 1) % CAT_ORDER.length];
    activeCat = nextCat; justPickedCat = true;
    document.querySelectorAll('.cat-btn').forEach(x=>x.classList.toggle('active', x.dataset.cat===nextCat));
    const di = dailyIndex(nextCat);
    if (di >= 0) cursor = masterIndex(nextCat, di);
    render();
  });
  // SHARE: shares the SITE, not the quote.
  const SITE_URL = 'https://jiltedcentuar23-stack.github.io/quoteline/';
  function toast(msg){
    const t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#12121f;color:#f4f4f8;padding:11px 22px;border-radius:10px;border:1px solid #2a2a44;font-size:13px;font-weight:600;box-shadow:0 0 20px rgba(0,0,0,.5);z-index:50;opacity:0;transition:opacity .25s';
    document.body.appendChild(t);
    requestAnimationFrame(()=>t.style.opacity='1');
    setTimeout(()=>{ t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, 1800);
  }
  el('shareBtn').addEventListener('click', () => {
    if (navigator.share) { navigator.share({ title:'Quoteline', text:'Fresh lines, daily.', url:SITE_URL }).catch(()=>{}); }
    else { navigator.clipboard.writeText(SITE_URL); toast('Site link copied!'); }
  });

  function boot(data){
    quotes = (data.quotes || data).filter(q => q.verified);
    updateCatCounts(); stats(); render();
  }
  if (typeof EMBEDDED_QUOTES !== 'undefined' && EMBEDDED_QUOTES.length) boot({quotes:EMBEDDED_QUOTES});
  else fetch('quotes.json').then(r=>r.json()).then(boot).catch(e=>{
    el('quoteText').innerHTML = 'Could not load data: '+esc(String(e))+' <span class="close">\u201D</span>';
  });
</script>
